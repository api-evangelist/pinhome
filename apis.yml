name: Pinhome
description: 'Pinhome is an Indonesian proptech real estate marketplace for smart buying,
  selling, and renting of houses, apartments, offices, and shop-houses (Pintar Jual
  Beli Sewa Rumah). The platform spans property listings and search, mortgage (KPR)
  and loan-takeover facilitation with partner banks, an automated property valuation
  tool (Pinvalue), and a marketplace of household and property services. Backed by
  Ribbit Capital, Pinhome operates a consumer-facing web and mobile product and does
  not publish a public developer API surface as of this enrichment pass.'
